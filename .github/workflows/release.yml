name: npm release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    name: Build, test, and dry-run publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@latest

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Build package
        run: npm run build --if-present

      - name: Test package
        run: npm test

      - name: Dry-run public publish with provenance
        run: npm publish --provenance --access public --dry-run

  publish:
    name: Publish package with npm provenance
    needs: stage
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-rc'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-production
    steps:
      - name: Check out production release
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@latest

      - name: Publish through npm trusted publishing
        run: npm publish --provenance --access public
